plugins { id 'com.android.application' }
android {
    namespace 'com.sanctuary.pranayama3d'
    compileSdk 35
    defaultConfig {
        // New application ID avoids conflicts with an earlier debug install.
        applicationId 'com.skrssixteen.pranayama3dsanctuary'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
